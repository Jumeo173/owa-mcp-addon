{% extends "base.html" %}
{% block content %}

<h3 class="mb-3"><i class="bi bi-key"></i> Секреты</h3>

<div class="row g-3 mb-3">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-header">Файлы</div>
      <div class="card-body p-0">
        <table class="table table-sm mb-0">
          <thead><tr><th>Файл</th><th>MD5</th><th></th></tr></thead>
          <tbody id="sec-files">
            <tr><td colspan="3" class="text-muted text-center">загрузка…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-header">Cookies — имена</div>
      <div class="card-body">
        <button class="btn btn-sm btn-outline-primary" onclick="loadCookieNames()">
          <i class="bi bi-eye"></i> Показать имена cookies
        </button>
        <ul class="mt-2 small mb-0" id="cnames"></ul>
      </div>
    </div>
  </div>
</div>

<div class="card shadow-sm">
  <div class="card-header">Скачать (зашифрованные)</div>
  <div class="card-body">
    <a class="btn btn-sm btn-outline-secondary" href="api/secrets/download/salt">.salt</a>
    <a class="btn btn-sm btn-outline-secondary" href="api/secrets/download/creds">.credentials.enc</a>
    <a class="btn btn-sm btn-outline-secondary" href="api/secrets/download/cookies">session-cookies.txt</a>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
async function loadSecrets() {
    const r = await fetch('api/secrets/state');
    const d = await r.json();
    const tb = document.getElementById('sec-files');
    tb.innerHTML = '';
    for (const [name, info] of Object.entries(d)) {
        if (!info.exists) {
            tb.innerHTML += `<tr class="text-muted"><td colspan="3">${name}: нет файла</td></tr>`;
            continue;
        }
        tb.innerHTML += `<tr>
          <td><code>${name}</code><div class="small text-muted">${info.path}</div></td>
          <td><code class="small">${info.md5}</code></td>
          <td><span class="badge bg-secondary">${info.size}B</span></td>
        </tr>`;
    }
}

async function loadCookieNames() {
    const ul = document.getElementById('cnames');
    ul.innerHTML = '<li class="text-muted">загрузка…</li>';
    const r = await fetch('api/secrets/cookie-names');
    const d = await r.json();
    if (!d.ok) {
        ul.innerHTML = '<li class="text-danger">' + (d.error || 'ошибка') + '</li>';
        return;
    }
    ul.innerHTML = d.names.map(n => `<li><code>${n}</code></li>`).join('');
    ul.innerHTML += `<li class="text-muted mt-2">всего: ${d.count}</li>`;
}

loadSecrets();
</script>
{% endblock %}
