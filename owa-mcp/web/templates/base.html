<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OWA MCP — {{ page|title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="static/style.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="status">
      <i class="bi bi-envelope-paper"></i> OWA MCP
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navmain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link {% if page=='status' %}active{% endif %}" href="status"><i class="bi bi-speedometer2"></i> Статус</a></li>
        <li class="nav-item"><a class="nav-link {% if page=='logs' %}active{% endif %}" href="logs"><i class="bi bi-file-text"></i> Логи</a></li>
        <li class="nav-item"><a class="nav-link {% if page=='secrets' %}active{% endif %}" href="secrets"><i class="bi bi-key"></i> Секреты</a></li>
        <li class="nav-item"><a class="nav-link {% if page=='actions' %}active{% endif %}" href="actions"><i class="bi bi-lightning"></i> Действия</a></li>
        <li class="nav-item"><a class="nav-link {% if page=='config' %}active{% endif %}" href="config"><i class="bi bi-gear"></i> Конфиг</a></li>
      </ul>
      <span class="navbar-text small" id="clock"></span>
    </div>
  </div>
</nav>

<main class="container-fluid py-4">
{% block content %}{% endblock %}
</main>

<footer class="text-center text-muted small py-3">
  OWA Exchange MCP addon &middot; <a href="https://github.com/Jumeo173/owa-mcp-addon" target="_blank">github</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
